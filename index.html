const search = document.getElementById("search");
const searchFormWrapper = document.getElementById("searchWrapper");
const searchCancel = document.getElementById("searchCancel");
const searchSuggestions = document.getElementById("searchSuggestions");
const heading = document.getElementById("heading");
const logo = document.getElementById("logo");
const randomButton = document.getElementById("randomButton");

const openDrawerBtn = document.getElementById("openDrawerBtn");
const closeDrawerBtn = document.getElementById("closeDrawerBtn");
const sidebarDrawer = document.getElementById("sidebarDrawer");
const drawerBackdrop = document.getElementById("drawerBackdrop");
const popularCategoriesBar = document.getElementById("popularCategories");
const recentSearchesRow = document.getElementById("recentSearchesRow");
const recentSearchesContainer = document.getElementById("recentSearchesContainer");
const drawerContent = document.getElementById("drawerContent");

const catScrollLeft = document.getElementById("catScrollLeft");
const catScrollRight = document.getElementById("catScrollRight");

catScrollLeft.addEventListener("click", () => {
    popularCategoriesBar.scrollBy({ left: -220, behavior: 'smooth' });
});
catScrollRight.addEventListener("click", () => {
    popularCategoriesBar.scrollBy({ left: 220, behavior: 'smooth' });
});

let videos = [];
let filteredVideos = [];
let currentPage = 1;
let fuseInstance = null;
let isLoaded = false;
let totalResults = 0;

function applySEOForContext(catName, searchQuery) {
    let titleText = "Sick Fetish - Video Archive";
    let descText = "Explore thousands of HD videos in our clean, curated video archive.";

    if (searchQuery) {
        titleText = `"${searchQuery}" Videos - Sick Fetish Archive`;
        descText = `Watch high quality free videos matching "${searchQuery}" on Sick Fetish archive.`;
    } else if (catName && catName !== "All") {
        titleText = `Free ${catName} Videos & Clips - Sick Fetish`;
        descText = `Browse our collection of high-definition ${catName} videos. Updated daily on Sick Fetish archive.`;
    }

    document.title = titleText;

    let metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.content = descText;

    let canonical = document.querySelector('link[rel="canonical"]');
    if (canonical) {
        const baseURL = window.location.origin + window.location.pathname;
        if (searchQuery) {
            canonical.href = `${baseURL}?q=${encodeURIComponent(searchQuery)}`;
        } else if (catName && catName !== "All") {
            canonical.href = `${baseURL}?cat=${encodeURIComponent(catName)}`;
        } else {
            canonical.href = baseURL;
        }
    }
}

function parseParamsFromURL() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get("q") || "";
    const cat = params.get("cat") || "All";

    activeSearchQuery = q.trim();
    activeCategory = activeSearchQuery ? "All" : cat;

    if (activeSearchQuery) {
        search.value = activeSearchQuery;
        searchFormWrapper.classList.add("has-text");
    } else {
        search.value = "";
        searchFormWrapper.classList.remove("has-text");
    }
}

function updateURLParams() {
    const url = new URL(window.location.href);
    if (activeSearchQuery) {
        url.searchParams.set("q", activeSearchQuery);
        url.searchParams.delete("cat");
    } else if (activeCategory && activeCategory !== "All") {
        url.searchParams.set("cat", activeCategory);
        url.searchParams.delete("q");
    } else {
        url.searchParams.delete("q");
        url.searchParams.delete("cat");
    }
    window.history.pushState({}, "", url.toString());
}

function shuffle(array) {
    const res = [...array];
    for (let i = res.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [res[i], res[j]] = [res[j], res[i]];
    }
    return res;
}

function getRecentSearches() {
    try {
        return JSON.parse(localStorage.getItem('sf_recent_searches') || '[]');
    } catch (_) {
        return [];
    }
}

function addRecentSearch(query) {
    const cleanQ = query.trim();
    if (!cleanQ) return;

    const isBuiltIn = CATEGORIES.some(c => c.name.toLowerCase() === cleanQ.toLowerCase());
    if (isBuiltIn) return;

    try {
        let history = getRecentSearches().filter(q => q.toLowerCase() !== cleanQ.toLowerCase());
        history.unshift(cleanQ);
        localStorage.setItem('sf_recent_searches', JSON.stringify(history.slice(0, 5)));
    } catch (_) {}
}

function getPersonalizedFeed(candidateVideos, latestVideos) {
    const unique = new Map();
    candidateVideos.forEach(video => unique.set(String(video.id), video));

    let history = [];
    try {
        history = JSON.parse(localStorage.getItem("sf_watch_history") || "[]");
    } catch (_) {}

    const counts = {};
    history.forEach(name => {
        if (name && name !== "All") counts[name] = (counts[name] || 0) + 1;
    });
    const favoriteCategories = Object.keys(counts)
        .sort((a, b) => counts[b] - counts[a])
        .slice(0, 3)
        .map(name => CATEGORIES.find(cat => cat.name === name))
        .filter(Boolean);

    const latestIds = new Set(latestVideos.map(video => String(video.id)));
    const relevant = [];
    const latest = [];
    const discovery = [];

    unique.forEach(video => {
        const isRelevant = favoriteCategories.some(cat => matchesCategory(video.title || "", cat));
        if (isRelevant) relevant.push(video);
        else if (latestIds.has(String(video.id))) latest.push(video);
        else discovery.push(video);
    });

    const queues = [shuffle(relevant), shuffle(discovery), shuffle(latest)];
    const order = favoriteCategories.length ? [0, 1, 0, 1, 2] : [1, 1, 2, 1];
    const result = [];
    let cursor = 0;

    while (queues.some(queue => queue.length)) {
        const queueIndex = order[cursor % order.length];
        if (queues[queueIndex].length) result.push(queues[queueIndex].shift());
        else {
            const fallbackIndex = queues.findIndex(queue => queue.length);
            if (fallbackIndex !== -1) result.push(queues[fallbackIndex].shift());
        }
        cursor++;
    }
    return result;
}

function toggleDrawer(open) {
    sidebarDrawer.classList.toggle("open", open);
    drawerBackdrop.classList.toggle("open", open);
}

openDrawerBtn.addEventListener("click", () => toggleDrawer(true));
closeDrawerBtn.addEventListener("click", () => toggleDrawer(false));
drawerBackdrop.addEventListener("click", () => toggleDrawer(false));

function renderCategoryNavs() {
    popularCategoriesBar.innerHTML = "";
    CATEGORIES.filter(c => c.popular)
        .sort((a, b) => (a.popularRank ?? 99) - (b.popularRank ?? 99))
        .forEach(cat => {
            const pill = document.createElement("a");
            const isActive = (!activeSearchQuery && activeCategory === cat.name);
            pill.className = "cat-pill" + (isActive ? " active" : "");
            pill.textContent = cat.name;
            pill.href = (cat.name === "All") ? "/" : `/?cat=${encodeURIComponent(cat.name)}`;
            pill.addEventListener("click", (e) => {
                e.preventDefault();
                selectCategory(cat.name);
            });
            popularCategoriesBar.appendChild(pill);
        });

    const recentSearches = getRecentSearches();
    recentSearchesContainer.innerHTML = "";
    if (recentSearches.length > 0) {
        recentSearchesRow.classList.add("visible");
        recentSearches.forEach(query => {
            const pill = document.createElement("a");
            const isActive = (activeSearchQuery === query || activeCategory === query);
            pill.className = "cat-pill temp" + (isActive ? " active" : "");
            pill.textContent = `🔍 ${query}`;
            pill.title = query;
            pill.href = `/?q=${encodeURIComponent(query)}`;
            pill.addEventListener("click", (e) => {
                e.preventDefault();
                triggerSearch(query);
            });
            recentSearchesContainer.appendChild(pill);
        });
    } else {
        recentSearchesRow.classList.remove("visible");
    }

    drawerContent.innerHTML = "";
    CATEGORIES.forEach(cat => {
        const btn = document.createElement("a");
        const isActive = (!activeSearchQuery && activeCategory === cat.name);
        btn.className = "drawer-item" + (isActive ? " active" : "");
        btn.href = (cat.name === "All") ? "/" : `/?cat=${encodeURIComponent(cat.name)}`;

        const matchCount = cat.name === activeCategory ? totalResults.toLocaleString() : "";
        btn.innerHTML = `<span>${cat.name}</span> <span class="drawer-item-count">${matchCount}</span>`;
        btn.addEventListener("click", (e) => {
            e.preventDefault();
            selectCategory(cat.name);
            toggleDrawer(false);
        });
        drawerContent.appendChild(btn);
    });

    if (recentSearches.length > 0) {
        const label = document.createElement("div");
        label.className = "drawer-section-label";
        label.textContent = "Recent Searches";
        drawerContent.appendChild(label);

        recentSearches.forEach(query => {
            const btn = document.createElement("a");
            const isActive = (activeSearchQuery === query || activeCategory === query);
            btn.className = "drawer-item" + (isActive ? " active" : "");
            btn.href = `/?q=${encodeURIComponent(query)}`;

            btn.innerHTML = `<span>🔍 ${query}</span>`;
            btn.addEventListener("click", (e) => {
                e.preventDefault();
                triggerSearch(query);
                toggleDrawer(false);
            });
            drawerContent.appendChild(btn);
        });
    }
}

function selectCategory(catName) {
    activeCategory = catName;
    activeSearchQuery = "";
    search.value = "";
    searchFormWrapper.classList.remove("has-text");
    updateURLParams();
    applyFilters();
}

function triggerSearch(query) {
    const cleanQ = query.trim();
    if (!cleanQ) return;
    activeSearchQuery = cleanQ;
    activeCategory = "All";
    search.value = cleanQ;
    searchFormWrapper.classList.add("has-text");
    updateURLParams();
    applyFilters();
}

async function fetchRecommendedFeed() {
    const seenKey = "sf_seen_feed_ids";
    let seen = new Set();
    try {
        seen = new Set(JSON.parse(sessionStorage.getItem(seenKey) || "[]").map(String));
    } catch (_) {}
    if (currentPage === 1) seen.clear();

    const makeRequest = async (offset) => {
        const params = new URLSearchParams({ limit: String(VIDEOS_PER_PAGE), offset: String(offset) });
        const response = await fetch(`${API_BASE}/api/videos?${params.toString()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Feed API returned ${response.status}`);
        return response.json();
    };

    const latestData = await makeRequest(0);
    totalResults = Number(latestData.total || 0);
    const latestVideos = Array.isArray(latestData.items) ? latestData.items : [];
    const candidateMap = new Map();
    latestVideos.forEach(video => candidateMap.set(String(video.id), video));

    // Sample several different windows across the complete database, not just its newest 30 rows.
    const maxOffset = Math.max(0, totalResults - VIDEOS_PER_PAGE);
    const offsets = new Set();
    while (offsets.size < 5 && maxOffset > 0) {
        offsets.add(Math.floor(Math.random() * (maxOffset + 1)));
    }

    const sampledPages = await Promise.all([...offsets].map(makeRequest));
    sampledPages.forEach(page => {
        (page.items || []).forEach(video => candidateMap.set(String(video.id), video));
    });

    let ranked = getPersonalizedFeed([...candidateMap.values()], latestVideos);
    ranked = ranked.filter(video => !seen.has(String(video.id)));

    // If a sampled window overlaps a previous page heavily, sample more windows until the page is filled.
    let attempts = 0;
    while (ranked.length < VIDEOS_PER_PAGE && attempts < 5 && maxOffset > 0) {
        attempts++;
        const extraOffset = Math.floor(Math.random() * (maxOffset + 1));
        const extraPage = await makeRequest(extraOffset);
        (extraPage.items || []).forEach(video => {
            const id = String(video.id);
            if (!candidateMap.has(id)) candidateMap.set(id, video);
        });
        ranked = getPersonalizedFeed([...candidateMap.values()], latestVideos)
            .filter(video => !seen.has(String(video.id)));
    }

    const pageVideos = ranked.slice(0, VIDEOS_PER_PAGE);
    pageVideos.forEach(video => seen.add(String(video.id)));
    try {
        sessionStorage.setItem(seenKey, JSON.stringify([...seen].slice(-3000)));
    } catch (_) {}
    return pageVideos;
}

async function applyFilters(resetPage = true) {
    if (!isLoaded) return;
    if (resetPage) currentPage = 1;

    applySEOForContext(activeCategory, activeSearchQuery);
    loader.style.display = "block";
    empty.style.display = "none";
    status.textContent = "Loading videos...";
    pagination.innerHTML = "";

    try {
        if (!activeSearchQuery && activeCategory === "All") {
            heading.textContent = "Recommended For You";
            filteredVideos = await fetchRecommendedFeed();
        } else {
            const params = new URLSearchParams({
                limit: String(VIDEOS_PER_PAGE),
                offset: String((currentPage - 1) * VIDEOS_PER_PAGE)
            });
            if (activeSearchQuery) {
                params.set("q", activeSearchQuery);
                addRecentSearch(activeSearchQuery);
                heading.textContent = `Search: "${activeSearchQuery}"`;
            } else {
                params.set("cat", activeCategory);
                heading.textContent = `${activeCategory} Videos`;
            }

            const response = await fetch(`${API_BASE}/api/videos?${params.toString()}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`API returned ${response.status}`);
            const data = await response.json();
            filteredVideos = Array.isArray(data.items) ? data.items : [];
            totalResults = Number(data.total || 0);
        }

        videos = filteredVideos;
        loader.style.display = "none";
        status.textContent = `${totalResults.toLocaleString()} videos in database · Showing ${filteredVideos.length}`;
        renderCategoryNavs();
        renderGrid();
        renderPagination();
    } catch (err) {
        console.error("Bunny API error:", err);
        loader.style.display = "none";
        status.textContent = "Could not load videos from the database.";
        empty.textContent = "Database connection failed. Check the Edge Script API URL and deployment.";
        empty.style.display = "block";
    }
}

function searchVideos(query, allVideos) {
    const cleanQuery = query.trim();
    if (!cleanQuery) return shuffle(allVideos);

    if (fuseInstance) {
        const results = fuseInstance.search(cleanQuery);
        const matchedItems = results.map(r => r.item);

        const topSlice = matchedItems.slice(0, 60);
        const remainingSlice = matchedItems.slice(60);

        return [...shuffle(topSlice), ...remainingSlice];
    }

    const fallbackMatches = allVideos.filter(v => v.title.toLowerCase().includes(cleanQuery.toLowerCase()));
    return shuffle(fallbackMatches);
}

function formatTitle(slug) {
    if (!slug) return "Untitled Video";
    let title = slug;
    try { title = decodeURIComponent(title); } catch (_) {}
    return title.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim().toLowerCase()
        .split(" ").map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : "").join(" ") || "Untitled Video";
}

function cleanUrl(rawUrl) {
    let url = String(rawUrl || "").trim();
    if (url.length >= 2 && ((url.startsWith('"') && url.endsWith('"')) || (url.startsWith("'") && url.endsWith("'")))) {
        url = url.slice(1, -1).trim();
    }
    return url.replace(/^https\/\//i, "https://").replace(/^http\/\//i, "http://");
}

function createThumbnailUrl(url, id) {
    const hostname = url.hostname.toLowerCase();
    const isPervertDomain = hostname.includes('pervertium.com') || hostname.includes('perverttube.com');
    const folder = Math.floor(parseInt(id, 10) / 1000) * 1000;

    if (isPervertDomain) {
        return `${url.origin}/contents/videos_screenshots/${folder}/${encodeURIComponent(id)}/preview.jpg`;
    }
    return `${url.origin}/contents/videos_screenshots/${folder}/${encodeURIComponent(id)}/264x198/1.jpg`;
}

function parseVideoUrl(rawUrl) {
    const cleaned = cleanUrl(rawUrl);
    if (!cleaned) return null;
    let url;
    try { url = new URL(cleaned); } catch (_) { return null; }
    const parts = url.pathname.split("/").filter(Boolean);

    const vIdx = parts.findIndex(p => {
        const lower = p.toLowerCase();
        return lower === "videos" || lower === "video";
    });

    if (vIdx !== -1 && parts[vIdx + 1]) {
        const id = parts[vIdx + 1];
        const titleSlug = parts.slice(vIdx + 2).join("-");
        const title = formatTitle(titleSlug);
        const embedUrl = url.origin + "/embed/" + encodeURIComponent(id);
        const thumbnailUrl = createThumbnailUrl(url, id);
        return { id, title, embedUrl, thumbnailUrl, sourceUrl: url.href };
    }
    return null;
}

async function loadVideos() {
    parseParamsFromURL();
    isLoaded = true;
    loader.style.display = "block";
    await applyFilters(false);
}

function renderGrid() {
    grid.innerHTML = "";
    const pageVideos = filteredVideos;

    if (pageVideos.length === 0) {
        empty.style.display = "block";
        return;
    }
    empty.style.display = "none";

    pageVideos.forEach(video => {
        const a = document.createElement("a");
        a.className = "card";

        const targetHref = makeVideoPageUrl(video, {
            from_q: activeSearchQuery,
            from_cat: activeCategory && activeCategory !== "All" ? activeCategory : ""
        });
        a.href = targetHref;

        const thumb = document.createElement("div");
        thumb.className = "thumbnail";
        if (video.thumbnailUrl) {
            const img = document.createElement("img");
            img.src = video.thumbnailUrl;
            img.alt = video.title;
            img.width = 264;
            img.height = 198;
            img.loading = "lazy";
            img.onerror = () => { img.onerror = null; img.src = FALLBACK_IMAGE; };
            thumb.appendChild(img);
        }

        const titleDiv = document.createElement("div");
        titleDiv.className = "title";
        titleDiv.textContent = video.title;

        a.appendChild(thumb);
        a.appendChild(titleDiv);
        grid.appendChild(a);
    });
}

function renderPagination() {
    pagination.innerHTML = "";
    const totalPages = Math.ceil(totalResults / VIDEOS_PER_PAGE);
    if (totalPages <= 1) return;

    const pageNumbers = new Set([1, totalPages]);
    for (let p = Math.max(1, currentPage - 2); p <= Math.min(totalPages, currentPage + 2); p++) pageNumbers.add(p);
    const sorted = [...pageNumbers].sort((a, b) => a - b);
    let previous = 0;

    sorted.forEach(page => {
        if (previous && page - previous > 1) {
            const dots = document.createElement("span");
            dots.className = "page-ellipsis";
            dots.textContent = "…";
            pagination.appendChild(dots);
        }
        const btn = document.createElement("button");
        btn.className = "page-button" + (page === currentPage ? " active" : "");
        btn.textContent = page;
        btn.addEventListener("click", async () => {
            currentPage = page;
            await applyFilters(false);
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
        pagination.appendChild(btn);
        previous = page;
    });
}

window.addEventListener("popstate", () => {
    parseParamsFromURL();
    applyFilters(true);
});

function updateSuggestionFocus() {
    const items = searchSuggestions.querySelectorAll(".suggestion-item");
    items.forEach((item, index) => {
        if (index === selectedSuggestionIndex) {
            item.classList.add("focused");
            item.scrollIntoView({ block: "nearest" });
        } else {
            item.classList.remove("focused");
        }
    });
}

let suggestionRequestId = 0;
search.addEventListener("input", async (e) => {
    const rawQ = e.target.value.trim();
    selectedSuggestionIndex = -1;
    const requestId = ++suggestionRequestId;
    searchFormWrapper.classList.toggle("has-text", rawQ.length > 0);
    if (rawQ.length < 2 || !isLoaded) {
        searchSuggestions.classList.remove("open");
        return;
    }

    try {
        const params = new URLSearchParams({ q: rawQ, limit: "6", offset: "0" });
        const response = await fetch(`${API_BASE}/api/videos?${params.toString()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Suggestion API returned ${response.status}`);
        const data = await response.json();
        if (requestId !== suggestionRequestId || search.value.trim() !== rawQ) return;

        const matches = Array.isArray(data.items) ? data.items.slice(0, 6) : [];
        if (!matches.length) {
            searchSuggestions.classList.remove("open");
            return;
        }

        searchSuggestions.innerHTML = "";
        matches.forEach(video => {
            const item = document.createElement("a");
            item.className = "suggestion-item";
            item.href = `/?q=${encodeURIComponent(video.title || "")}`;
            item.innerHTML = "🔍 <span></span>";
            item.querySelector("span").textContent = video.title || "Untitled Video";
            item.addEventListener("click", (event) => {
                event.preventDefault();
                triggerSearch(video.title || rawQ);
                searchSuggestions.classList.remove("open");
            });
            searchSuggestions.appendChild(item);
        });
        searchSuggestions.classList.add("open");
    } catch (error) {
        console.error("Suggestion search failed:", error);
        if (requestId === suggestionRequestId) searchSuggestions.classList.remove("open");
    }
});

search.addEventListener("keydown", (e) => {
    const items = searchSuggestions.querySelectorAll(".suggestion-item");
    if (!searchSuggestions.classList.contains("open") || !items.length) return;

    if (e.key === "ArrowDown") {
        e.preventDefault();
        selectedSuggestionIndex = (selectedSuggestionIndex + 1) % items.length;
        updateSuggestionFocus();
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        selectedSuggestionIndex = (selectedSuggestionIndex - 1 + items.length) % items.length;
        updateSuggestionFocus();
    } else if (e.key === "Escape") {
        searchSuggestions.classList.remove("open");
        selectedSuggestionIndex = -1;
    } else if (e.key === "Enter" && selectedSuggestionIndex >= 0) {
        e.preventDefault();
        items[selectedSuggestionIndex].click();
    }
});

searchForm.addEventListener("submit", (e) => {
    e.preventDefault();
    searchSuggestions.classList.remove("open");
    const query = search.value.trim();
    if (query) {
        triggerSearch(query);
    }
});

searchCancel.addEventListener("click", () => {
    selectCategory("All");
    searchSuggestions.classList.remove("open");
});

randomButton.addEventListener("click", async () => {
    try {
        const response = await fetch(`${API_BASE}/api/videos?random=1`, { cache: "no-store" });
        if (!response.ok) throw new Error("Random video request failed");
        const data = await response.json();
        if (data.item) window.location.href = makeVideoPageUrl(data.item);
    } catch (err) { console.error(err); status.textContent = "Could not load a random video."; }
});

loadVideos();
</script>
